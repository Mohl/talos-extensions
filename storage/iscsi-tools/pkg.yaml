name: iscsi-tools
variant: scratch
shell: /bin/bash
dependencies:
  # `base` dependency is used for doing cleanups
  # not copied to rootfs
  - stage: base
  - stage: open-iscsi
  - stage: multipath-tools
steps:
  - install:
    - |
      mkdir -p /rootfs/usr/local/lib/containers/iscsid

      # cleanup
      rm -rf /rootfs/usr/local/include
      rm -rf /rootfs/usr/share
    - |
      mkdir -p /rootfs/usr/local/etc/containers

      cp /pkg/iscsid.yaml /rootfs/usr/local/etc/containers/iscsid.yaml
    test:
      - |
        # Verify that all expected binaries are present
        for binary in iscsid iscsiadm multipath multipathd multipathc mpathpersist kpartx; do
          if [ ! -f "/rootfs/usr/local/sbin/$binary" ] && [ ! -f "/rootfs/usr/local/bin/$binary" ]; then
            echo "ERROR: Binary $binary not found in /rootfs/usr/local/{sbin,bin}/"
            exit 1
          fi
        done
      - |
        # Verify kpartx_id udev helper is present and executable
        if [ ! -x "/rootfs/usr/lib/udev/rules.d/kpartx_id" ]; then
          echo "ERROR: kpartx_id helper script not found or not executable"
          exit 1
        fi
      - |
        # Verify udev rules reference kpartx_id correctly
        if ! grep -q "kpartx_id" /rootfs/usr/lib/udev/rules.d/11-dm-mpath.rules; then
          echo "ERROR: 11-dm-mpath.rules does not reference kpartx_id"
          exit 1
        fi
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
    sbom:
      outputPath: /rootfs/usr/local/share/spdx/iscsi-tools.spdx.json
      version: {{ .VERSION }}
      cpes:
        - cpe:2.3:a:open-iscsi_project:open-iscsi:{{ .OPEN_ISCSI_VERSION }}:*:*:*:*:*:*:*
        - cpe:2.3:a:multipath-tools_project:multipath-tools:{{ .MULTIPATH_TOOLS_VERSION }}:*:*:*:*:*:*:*
      licenses:
        - GPL-2.0
        - LGPL-2.0
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
